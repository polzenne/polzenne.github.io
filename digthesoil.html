<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>土を掘れ！スコアランキング</title>
  <!-- ビューポート設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
  <!-- DataTables Responsive拡張 -->
  <link rel="stylesheet" href="https://cdn.datatables.net/responsive/2.5.0/css/responsive.bootstrap5.min.css">
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/dataTables.responsive.min.js"></script>
  <script src="https://cdn.datatables.net/responsive/2.5.0/js/responsive.bootstrap5.min.js"></script>
</head>
<body>
<div class="container mt-5">
  <h2>土を掘れ！スコアランキング</h2>
  <div id="table-area"></div>
</div>

<script>
const url = "https://script.google.com/macros/s/AKfycbxhXlJD-Tjo3PsQr2CWb1MZsT8T5EO8j2f-mOxM_BHgZ_whkHjIXTt1tuUI1IcW5Vpi/exec";

fetch(url)
  .then(res => res.text())
  .then(data => {
    // データ変換
    const rows = data.split('%0A')
      .map(row => row.split('%2C').map(col => decodeURIComponent(col)))
      .filter(cols => cols.length === 4 && Number(cols[1]) > 0); // スコア0除く

    // スコア降順ソート
    rows.sort((a, b) => Number(b[1]) - Number(a[1]));

    // テーブルHTML生成
    let table = `
      <table id="scoreTable" class="table table-bordered table-striped align-middle nowrap" style="width:100%">
        <thead class="table-dark">
          <tr>
            <th>順位</th>
            <th>名前</th>
            <th>スコア</th>
            <th>日付</th>
          </tr>
        </thead><tbody>
    `;
    rows.forEach((cols, idx) => {
      table += `<tr>
        <td>${idx + 1}</td>
        <td>${cols[0]}</td>
        <td>${cols[1]}</td>
        <td>${cols[2]}</td>
      </tr>`;
    });
    table += '</tbody></table>';
    $("#table-area").html(table);

    // DataTable初期化　レスポンシブ指定
    $("#scoreTable").DataTable({
      language: {
        url: "https://cdn.datatables.net/plug-ins/1.13.7/i18n/ja.json"
      },
      pageLength: 10,
      lengthMenu: [5, 10, 20, 50, 100],
      responsive: true
    });
  });
</script>

</body>
</html>
